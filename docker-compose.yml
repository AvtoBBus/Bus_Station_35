name: my-proj
services:
    mysql:
        image: mysql:8.0
        container_name: mysql_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: "root"
            MYSQL_DATABASE: "new_schema"
            MYSQL_ALLOW_EMPTY_PASSWORD: "no"
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        command:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 30s
            retries: 5
            interval: 10s
            start_period: 40s

    xssdetector:
        build:
            context: ./xssdetector
            dockerfile: Dockerfile
        container_name: xss-detector
        restart: unless-stopped
        ports:
            - "8001:8001"
        volumes:
            - ./xssdetector:/xssdetector
        networks:
            - app-network
    fastapi:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: fastapi_app
        restart: unless-stopped
        ports:
            - "8000:8000"
        volumes:
            - ./server:/server
        working_dir: /server
        environment:
            APP_DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/new_schema
            APP_DB_HOST: mysql
            APP_DB_PORT: 3306
            APP_DB_USER: "root"
            APP_DB_PASSWORD: "root"
            APP_DB_NAME: "new_schema"
        env_file:
            - ./server/.env
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    client:
        build:
            context: ./ssrw-client
            dockerfile: Dockerfile
        container_name: client
        restart: unless-stopped
        ports:
            - "3000:3000"
        volumes:
            - ./ssrw-client:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        networks:
            - app-network
        depends_on:
            - fastapi
            - xssdetector
            - modsecurity

    modsecurity:
        image: owasp/modsecurity-crs:nginx
        container_name: modsecurity_crs
        restart: unless-stopped
        ports:
            - "8080:8080"
        volumes:
            - ./modsecurity/modsecurity.conf:/etc/modsecurity.d/modsecurity.conf:ro
            - ./modsecurity/crs-setup.conf:/etc/modsecurity.d/crs-setup.conf:ro
        environment:
            - PARANOIA_LEVEL=1
            - ANOMALY_INBOUND=5
            - MODSEC_RULE_SET=OWASP_CRS
        networks:
            - app-network
        depends_on:
            - fastapi
volumes:
    mysql_data:

networks:
    app-network:
        driver: bridge
