# ModSecurity v3 configuration for OWASP CRS evaluation
# Used for XSS baseline comparison (punkt 2.5)

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 13107200
RequestBodyLimitAction Reject
SecRequestBodyInMemoryLimit 131072

# Audit log
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Debug
SecDebugLog /var/log/modsec_debug.log
SecDebugLogLevel 0

# OWASP CRS rules are loaded via crs-setup.conf and rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf etc.
# Anomaly scoring is handled by OWASP CRS.

# For XSS-only evaluation, we focus on rule family 941xxx (XSS Detection).
# The paranoia level is controlled via the PARANOIA_LEVEL env var in docker-compose.