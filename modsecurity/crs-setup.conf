# OWASP CRS v4 setup configuration
# XSS baseline comparison (punkt 2.5)

# Set paranoia level (1-4). Controlled via PARANOIA_LEVEL env var.
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.crs_setup_version='4.0',\
    setvar:tx.paranoia_level=1"

# Anomaly scoring thresholds
SecAction \
    "id:900120,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# XSS-only: focus on 941xxx rule family
# Other rule families (93xxx SQLi, 942xxx etc.) can be excluded for XSS-focused evaluation

SecAction \
    "id:900130,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.xss_only_mode=1"